# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

# the FINAL test set: set aside once by split_dev_test(), stratified, never fitted on, tuned on or scored.
# Don't change these after week 4 -- a new seed would let you "see" different test rows.
test_set:
  size: 0.2
  random_state: 42

# models are judged by stratified k-fold cross-validation of the whole pipeline on the development set
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   #one metric for now, so numbers compare directly with the earlier weeks
  n_jobs: 1             

diagnostics:
  id_column: "id"
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" must be listed: the category cleanup turns text into str first, which turns a genuine NaN into
  # the string "nan" -- listed tokens go back to NaN in its last step, so no fake category survives
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    juv_misd_count: {min: 0}      # counts can't be negative (no violations today, but cheap to guard)
    juv_other_count: {min: 0}
    priors_count: {min: 0, max: 60}
  # a number and the category derived from it can each be valid but contradict each other. We can't tell
  # which one is wrong, so BOTH become NaN and get imputed (bounds inclusive: age 25 / 45 sit on a bucket
  # boundary, so both neighbouring buckets accept them)
  consistency_checks:
    - numeric: age
      category: age_cat
      ranges:
        "Less than 25": {max: 25}
        "25 - 45": {min: 25, max: 45}
        "Greater than 45": {min: 45}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (EDA notebook's correlation heatmap + VIF section), dropped by clean_dataset()
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

preprocessing:
  # encoder and scaler are chosen by hand (any alternative is one config change away):
  encoder: "target"      # compact (one column per feature instead of one per category) and informative; reads y, but sklearn's
                         # TargetEncoder is cross-fitted, so a row's own label never leaks into its own encoding
  scaler: "robust"       # median/IQR: the few extreme counts (priors_count) don't set the scale for everyone else
  random_state: 42       # seeds the target encoder's internal cross-fitting
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # -> adds priors_count_was_missing, c_charge_degree_was_missing
  # only used by the "ordinal" encoder: a meaningful order per column (alphabetical would be arbitrary)
  ordinal_categories:
    sex: ["Female", "Male"]
    age_cat: ["Less than 25", "25 - 45", "Greater than 45"]
    c_charge_degree: ["M", "F"]    # misdemeanor < felony
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"   # applies to sex, age_cat, c_charge_degree

model:
  type: "random_forest"   # dummy | logistic_regression | decision_tree | random_forest
  params:
    random_state: 42
    random_state: 42
    n_jobs: -1            # all CPU cores (trees are built in parallel)
  # to try another model, change `type` and `params` together, e.g.
  #   type: "decision_tree"          params: {random_state: 42}
  #   type: "logistic_regression"    params: {max_iter: 2000}
  #   type: "oblique_random_forest"  params: {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  #   type: "adaboost"               params: {max_depth: 1, n_estimators: 50, random_state: 42}   # max_depth 1 = stumps

# week 5: hyperparameter tuning with Optuna, on the development set only. Every candidate is scored by
# stratified CV of the WHOLE pipeline (preprocessing re-fit in every fold of every trial), on the same
# folds for every candidate. With `enabled: true`, main.py also runs nested CV (the tuning repeated inside
# each outer CV fold) -- the honest number -- and then tunes once on all development rows for the final model.
tuning:
  enabled: true
  n_trials: 30                                      # trials per study (nested CV runs one study per outer fold, plus the final one)
  n_splits: 5                                       # inner folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # One search space per model type. Keys are Pipeline parameter names (step name, two underscores,
  # parameter). Types: int / float (low, high, optional log: true) or categorical (choices).
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}   # inverse regularisation strength (smaller = stronger)
    random_forest:                                  # each trial fits many trees: try n_trials: 15 and cv.n_jobs: -1
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # random combinations per tree; <= number of features
    adaboost:                                       # the base trees' depth, the number of rounds and the learning rate
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
